name: docs-build

on:
  release:
    types: [published]
  repository_dispatch:
    types: docs-build

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build Docs
        uses: laminas/documentation-theme/github-actions/docs@714c43f745f03dcd016b51b527fd81f77f092ef7 # master
        env:
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
